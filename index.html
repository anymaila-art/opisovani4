<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opisování slov – verze 1.4</title>
  <style>
    :root{
      --bg:#f6f8fc;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --accent:#2563eb;
      --ok:#15803d;
      --bad:#b91c1c;
      --border:#dbe2ea;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .app{
      width:min(760px,100%);
      background:var(--card);
      border-radius:24px;
      padding:28px;
      box-shadow:0 12px 40px rgba(0,0,0,.08);
      text-align:center;
    }
    h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}
    .subtitle{color:var(--muted);margin-bottom:22px}
    .switches{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:26px;
    }
    button{
      font:inherit;
      cursor:pointer;
      border:none;
      border-radius:14px;
      padding:12px 18px;
      font-weight:700;
    }
    .length-btn{
      background:#eef2f7;
      color:var(--text);
    }
    .length-btn.active{
      background:var(--accent);
      color:white;
    }
    .word-box{
      min-height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:2px solid var(--border);
      border-radius:20px;
      margin-bottom:18px;
      background:#fbfdff;
    }
    #word{
      font-size:clamp(52px,12vw,92px);
      font-weight:900;
      letter-spacing:.12em;
      padding-left:.12em;
    }
    label{
      display:block;
      font-weight:700;
      margin-bottom:8px;
    }
    #answer{
      width:min(420px,100%);
      font-size:clamp(30px,7vw,48px);
      text-transform:uppercase;
      text-align:center;
      letter-spacing:.12em;
      border:3px solid var(--border);
      border-radius:16px;
      padding:12px 16px;
      outline:none;
    }
    #answer:focus{border-color:var(--accent)}
    .message{
      min-height:42px;
      font-size:24px;
      font-weight:800;
      margin:14px 0 8px;
    }
    .ok{color:var(--ok)}
    .bad{color:var(--bad)}
    .score{
      font-size:19px;
      margin-bottom:18px;
    }
    .actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .next{background:var(--accent);color:white}
    .reset{background:#eef2f7;color:var(--text)}
    .small{
      margin-top:18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }
    @media (max-width:520px){
      .app{padding:20px 14px;border-radius:18px}
      .word-box{min-height:120px}
      button{padding:11px 14px}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>⌨️ Opisování slov <small style="font-size:.38em;color:#6b7280">v1.4</small></h1>
    <div class="subtitle">Podívej se na slovo a napiš ho na klávesnici.</div>

    <div class="switches" aria-label="Počet písmen">
      <button class="length-btn active" data-length="3">3 písmena</button>
      <button class="length-btn" data-length="4">4 písmena</button>
      <button class="length-btn" data-length="5">5 písmen</button>
    </div>

    <section class="word-box">
      <div id="word">PES</div>
    </section>

    <label for="answer">Napiš stejné slovo:</label>
    <input id="answer" type="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" maxlength="5" aria-describedby="message" />

    <div id="message" class="message"></div>
    <div class="score">⭐ Správně: <strong id="correct">0</strong> &nbsp; | &nbsp; Pokusy: <strong id="attempts">0</strong></div>

    <div class="actions">
      <button class="next" id="nextBtn">Další slovo</button>
      <button class="reset" id="resetBtn">Vynulovat skóre</button>
    </div>

    <div class="small">
      Kontrola proběhne automaticky po napsání celého slova. Velká a malá písmena nevadí.
    </div>

    <div class="switches" aria-label="Diakritika" style="margin-top:22px;margin-bottom:0">
      <button class="length-btn active" id="diaOff">Diakritika VYP</button>
      <button class="length-btn" id="diaOn">Diakritika ZAP</button>
    </div>
  </main>

<script>
const words = {
  3: [
    "pes","les","den","noc","rok","led","med","sad","syn","byt",
    "nos","bok","zub","lev","had","rak","čaj","čáp","míč","kůň",
    "vůz","mák","lak","lom","luk","sud","dar","sen","krk","dub"
  ],
  4: [
    "auto","bota","díra","drak","film","hora","hrad","kolo","kosa","koza",
    "krev","list","lupa","lano","léto","mapa","maso","metr","mrak","orel",
    "pero","pila","plod","pole","ruka","ryba","sako","stan","stůl","šaty",
    "šnek","vlak","vlna","voda","země","žába","most","park","ocas","déšť"
  ],
  5: [
    "balón","beran","brána","cesta","dopis","dveře","hlava","houba","kabát","kámen",
    "kočka","koník","kopec","kráva","lampa","louka","měsíc","miska","motýl","mrkev",
    "obraz","ovoce","papír","párek","robot","salát","strom","taška","talíř","tráva",
    "zebra","zámek","židle","škola","kniha","myška","vejce"
  ]
};

// Odstranění případných položek, které nemají správnou délku.
for (const len of [3,4,5]) {
  words[len] = words[len].filter(w => [...w].length === len);
}

let selectedLength = 3;
let diacriticsOn = false;

function stripDiacritics(text){
  return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function shownWord(word){
  return diacriticsOn ? word : stripDiacritics(word);
}
let currentWord = "";
let correct = 0;
let attempts = 0;
let locked = false;
let previousWord = "";

const wordEl = document.getElementById("word");
const answerEl = document.getElementById("answer");
const messageEl = document.getElementById("message");
const correctEl = document.getElementById("correct");
const attemptsEl = document.getElementById("attempts");

function beep(success=true){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();

    function tone(freq, start, duration, volume=0.10, type="sine"){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(volume, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + duration);
    }

    if(success){
      // Výrazná veselá vítězná znělka.
      tone(523.25, 0.00, 0.18, 0.12, "triangle");
      tone(659.25, 0.15, 0.18, 0.12, "triangle");
      tone(783.99, 0.30, 0.30, 0.14, "triangle");
    }else{
      // Jasně odlišný zvuk chyby.
      tone(260, 0.00, 0.20, 0.10, "sawtooth");
      tone(185, 0.18, 0.32, 0.11, "sawtooth");
    }
  }catch(e){}
}

function pickWord(){
  const list = words[selectedLength];
  let next = list[Math.floor(Math.random()*list.length)];
  if(list.length > 1){
    while(next === previousWord){
      next = list[Math.floor(Math.random()*list.length)];
    }
  }
  currentWord = next;
  previousWord = next;
  wordEl.textContent = shownWord(currentWord).toLocaleUpperCase("cs-CZ");
  answerEl.value = "";
  answerEl.maxLength = selectedLength;
  messageEl.textContent = "";
  messageEl.className = "message";
  locked = false;
  answerEl.focus();
}

function updateScore(){
  correctEl.textContent = correct;
  attemptsEl.textContent = attempts;
}

function normalize(s){
  let value = s.trim().toLocaleLowerCase("cs-CZ");
  return diacriticsOn ? value : stripDiacritics(value);
}

answerEl.addEventListener("input", () => {
  if(locked) return;

  const typed = normalize(answerEl.value);
  if([...typed].length < selectedLength){
    messageEl.textContent = "";
    messageEl.className = "message";
    return;
  }

  attempts++;
  if(typed === normalize(currentWord)){
    correct++;
    locked = true;
    messageEl.textContent = "🎉 SPRÁVNĚ!";
    messageEl.className = "message ok";
    beep(true);
    updateScore();
    setTimeout(pickWord, 850);
  }else{
    messageEl.textContent = "Zkus to ještě jednou 🙂";
    messageEl.className = "message bad";
    beep(false);
    updateScore();
    setTimeout(() => {
      answerEl.value = "";
      messageEl.textContent = "";
      messageEl.className = "message";
      answerEl.focus();
    }, 650);
  }
});

document.querySelectorAll(".length-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedLength = Number(btn.dataset.length);
    document.querySelectorAll(".length-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    pickWord();
  });
});

document.getElementById("diaOff").addEventListener("click", () => {
  diacriticsOn = false;
  document.getElementById("diaOff").classList.add("active");
  document.getElementById("diaOn").classList.remove("active");
  pickWord();
});

document.getElementById("diaOn").addEventListener("click", () => {
  diacriticsOn = true;
  document.getElementById("diaOn").classList.add("active");
  document.getElementById("diaOff").classList.remove("active");
  pickWord();
});

document.getElementById("nextBtn").addEventListener("click", pickWord);

document.getElementById("resetBtn").addEventListener("click", () => {
  correct = 0;
  attempts = 0;
  updateScore();
  pickWord();
});

pickWord();
</script>
</body>
</html>
